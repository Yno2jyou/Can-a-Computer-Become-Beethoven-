<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Can a Computer Become Beethoven?</title>
<meta name="description" content="An experiment: a human plays five notes, then a computer composes on its own. Can structure emerge from memory, repetition and chance?">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#FFFFFF;color:#111;
    font-family:ui-monospace,'SF Mono','Courier New',monospace;
    display:flex;flex-direction:column;min-height:100vh;
    overflow-x:hidden;
  }
  .hidden{display:none!important}

  /* Corners */
  #corners{position:fixed;inset:0;pointer-events:none;z-index:5}
  .corner{position:absolute;font-size:11px;letter-spacing:.15em;color:#999;line-height:1.5}
  .corner .value{color:#333}
  .corner.tl{top:16px;left:16px}
  .corner.tr{top:16px;right:16px;text-align:right}
  .corner.bl{bottom:16px;left:16px}
  .corner.br{bottom:16px;right:16px;text-align:right}

  /* Main */
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
  h1{
    font-family:Georgia,'Times New Roman',serif;
    font-size:clamp(18px,3.4vw,38px);
    color:#000;text-align:center;line-height:1.1;
    margin-bottom:clamp(20px,5vh,48px);font-weight:500;letter-spacing:-.02em;
  }

  /* Keyboard — desktop proportions, scaled to fit (no horizontal scroll) */
  #kb-scroll{
    width:100%;max-width:960px;overflow:hidden;
  }
  #kb-wrap{
    width:960px;position:relative;
    height:clamp(180px,32vh,300px);
    transform-origin:top left;
  }
  #keyboard{display:flex;width:100%;height:100%}
  .wkey{
    flex:1;min-width:0;background:#FFF;border:1px solid #000;
    transition:background-color .075s;cursor:pointer;
    touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;
  }
  .wkey.seed{background:#EEE}
  .wkey.active{background:#00FF41;box-shadow:0 0 26px 2px rgba(0,255,65,.6)}
  #black-keys{position:absolute;top:0;left:0;right:0;height:62%;pointer-events:none}
  .bkey{
    position:absolute;height:100%;background:#000;border:1px solid #000;
    transition:background-color .075s;cursor:pointer;pointer-events:auto;
    touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;
  }
  .bkey.active{background:#00FF41;box-shadow:0 0 22px 2px rgba(0,255,65,.6)}

  /* Counter */
  #counter{margin-top:16px;height:32px;display:flex;align-items:center;justify-content:center}
  #counter span{font-size:14px;letter-spacing:.3em;color:#999}
  #counter span.hint{color:#00AA22;animation:pulse 1.2s infinite}
  #counter span.thinking{animation:pulse 1.2s infinite;letter-spacing:.4em}
  #counter span.composing{font-size:12px;color:#777}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* Visualizer */
  #viz{width:100%;max-width:960px;margin-top:16px;height:clamp(48px,9vh,90px);display:block}

  /* Controls */
  #controls{margin-top:16px;height:32px;display:flex;align-items:center;gap:24px}
  .btn{
    font-family:inherit;font-size:11px;letter-spacing:.25em;
    color:#777;background:none;border:none;cursor:pointer;transition:color .15s;
  }
  .btn:hover{color:#000}
  .btn.go{color:#00AA22}.btn.go:hover{color:#000}
  .btn.stop{color:#555}.btn.stop:hover{color:#000}

  /* Overlays */
  .overlay{position:fixed;inset:0;z-index:20;background:#FFF;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .stats{font-size:12px;letter-spacing:.2em;color:#999;line-height:1.8;margin-bottom:40px}
  .stats .v{color:#111;font-size:18px;display:block;margin-top:4px}
  .replay-label{font-size:11px;letter-spacing:.25em;color:#999;margin-bottom:16px}
  .seek-wrap{width:100%;max-width:420px;margin-bottom:28px}
  .seek-bar{
    position:relative;width:100%;height:28px;cursor:pointer;
    display:flex;align-items:center;
  }
  .seek-track{
    position:absolute;left:0;right:0;height:3px;background:#DDD;border-radius:2px;
  }
  .seek-fill{
    position:absolute;left:0;height:3px;background:#00AA22;border-radius:2px;width:0%;
    pointer-events:none;
  }
  .seek-handle{
    position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;margin-left:-6px;
    background:#00AA22;border-radius:50%;left:0%;pointer-events:none;
    box-shadow:0 0 0 2px #FFF,0 1px 4px rgba(0,0,0,.15);
  }
  .seek-meta{
    display:flex;justify-content:space-between;margin-top:10px;
    font-size:11px;letter-spacing:.15em;color:#999;
  }
  .seek-meta .pos{color:#333}
  .replay-controls{display:flex;gap:24px;align-items:center;margin-bottom:32px}
  .replay-play{
    font-family:inherit;font-size:13px;letter-spacing:.25em;color:#00AA22;
    background:none;border:none;cursor:pointer;transition:color .15s;
  }
  .replay-play:hover{color:#000}
  .replay-play.playing{color:#555}
  .actions{display:flex;gap:32px;align-items:center}
  .act-btn{
    font-family:inherit;font-size:14px;letter-spacing:.3em;color:#444;
    background:none;border:none;cursor:pointer;transition:color .15s;
  }
  .act-btn:hover{color:#00AA22}
  .act-btn.muted:hover{color:#000}
  .share-url{margin-top:16px;font-size:10px;color:#999;max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="corners" class="hidden">
  <div class="corner tl"><div>TIME</div><div id="c-time" class="value">00:00</div></div>
  <div class="corner tr"><div>NOTES</div><div id="c-notes" class="value">0</div></div>
  <div class="corner bl"><div>PHRASES</div><div id="c-phrases" class="value">0</div></div>
  <div class="corner br"><div>MEMORY</div><div id="c-memory" class="value">0</div></div>
</div>
<main>
  <h1>CAN A COMPUTER BECOME BEETHOVEN?</h1>
  <div id="kb-scroll">
    <div id="kb-wrap">
      <div id="keyboard"></div>
      <div id="black-keys"></div>
    </div>
  </div>
  <div id="counter"><span>0 / 5</span></div>

<div id="result" class="overlay hidden">
  <div class="stats">
    <div>HUMAN<span class="v" id="r-human">5 NOTES</span></div>
    <div>COMPUTER<span class="v" id="r-computer">0 NOTES</span></div>

  <div class="seek-wrap" id="result-seek">

  <div class="replay-controls">
    <button class="replay-play" id="result-play">▶ PLAY</button>
  </div>

<div id="shared" class="overlay hidden">

  <div class="replay-label">REPLAY</div>
  <div class="seek-wrap" id="shared-seek">
    <div class="seek-bar" data-seek="shared">
      <div class="seek-track"></div>
      <div class="seek-fill" id="shared-fill"></div>
      <div class="seek-handle" id="shared-handle"></div>
    </div>
    <div class="seek-meta">
      <span class="pos" id="shared-pos">0 / 0</span>
      <span id="shared-time">00:00</span>
    </div>
  </div>
  <div class="replay-controls">
    <button class="replay-play" id="shared-play">▶ PLAY</button>
  </div>
  <button class="act-btn muted" id="start-own-btn" style="margin-top:8px">[ START YOUR OWN ]</button>
</div>

<script>
(function(){
"use strict";

/* ========== AUDIO ENGINE (WAV PCM, no Web Audio API) ========== */
function _writeStr(view,offset,str){for(var i=0;i<str.length;i++)view.setUint8(offset+i,str.charCodeAt(i));}
function _encodeWav(samples,sampleRate){
  var numSamples=samples.length,dataSize=numSamples*2;
  var buffer=new ArrayBuffer(44+dataSize),view=new DataView(buffer);
  _writeStr(view,0,'RIFF');view.setUint32(4,36+dataSize,true);_writeStr(view,8,'WAVE');
  _writeStr(view,12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);
  view.setUint32(24,sampleRate,true);view.setUint32(28,sampleRate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);
  _writeStr(view,36,'data');view.setUint32(40,dataSize,true);
  var offset=44;
  for(var i=0;i<numSamples;i++){
    var s=Math.max(-1,Math.min(1,samples[i]));
    view.setInt16(offset,s<0?s*0x8000:s*0x7FFF,true);offset+=2;
  }
  return buffer;
}
function resumeAudio(){}
function playNote(midi,duration,velocity){
  duration=duration||0.4;velocity=velocity||0.8;
  var freq=440*Math.pow(2,(midi-69)/12);
  var sampleRate=44100,numSamples=Math.floor(duration*sampleRate);
  var samples=new Float32Array(numSamples);
  for(var i=0;i<numSamples;i++){
    var t=i/sampleRate,env=Math.exp(-t*2.5);
    var s=Math.sin(2*Math.PI*freq*t)*1.0+Math.sin(2*Math.PI*freq*2*t)*0.32+Math.sin(2*Math.PI*freq*3*t)*0.12+Math.sin(2*Math.PI*freq*4*t)*0.06;
    samples[i]=s*env*(velocity*0.3);
  }
  var wav=_encodeWav(samples,sampleRate);
  var blob=new Blob([wav],{type:'audio/wav'});
  var url=URL.createObjectURL(blob);
  var audio=new Audio(url);
  audio.play().catch(function(){});
  audio.onended=function(){URL.revokeObjectURL(url);};
}

/* ========== COMPOSER ========== */
var RANGE={low:48,high:84};
function clamp(n){while(n<RANGE.low)n+=12;while(n>RANGE.high)n-=12;return n;}
function rand(a,b){return a+Math.random()*(b-a);}
function randInt(a,b){return Math.floor(rand(a,b+1));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function growth(elapsedMs){return Math.min(1,elapsedMs/180000);}

var INTERVALS=[0,1,2,3,4,5,7,12];
var W_EARLY=[10,8,12,7,7,9,11,7];
var W_LATE=[22,16,18,11,8,6,4,2];
function intervalWeights(g){
  var w=[];for(var i=0;i<INTERVALS.length;i++)w.push(W_EARLY[i]+(W_LATE[i]-W_EARLY[i])*g);
  return w;
}
function weightedPick(items,weights){
  var total=0;for(var i=0;i<weights.length;i++)total+=weights[i];
  var r=Math.random()*total;
  for(var i=0;i<items.length;i++){r-=weights[i];if(r<=0)return items[i];}
  return items[items.length-1];
}
function nextByInterval(lastNote,g){
  var iv=weightedPick(INTERVALS,intervalWeights(g));
  var dir=iv===0?0:(Math.random()<0.5?-1:1);
  return clamp(lastNote+dir*iv);
}
function transpose(seq,semis){var r=[];for(var i=0;i<seq.length;i++)r.push(clamp(seq[i]+semis));return r;}
function invertSeq(seq){
  if(seq.length===0)return seq;
  var axis=seq[0],r=[];
  for(var i=0;i<seq.length;i++)r.push(i===0?seq[i]:clamp(axis-(seq[i]-axis)));
  return r;
}
function partialSeq(seq){
  var len=Math.max(2,Math.floor(seq.length*(0.4+Math.random()*0.4)));
  return seq.slice(0,len);
}
var DURATIONS=[0.25,0.3,0.35,0.45,0.6],DUR_W=[3,4,4,2,1];
function nextDuration(){return weightedPick(DURATIONS,DUR_W);}

function createComposer(seed){
  var state={
    seed:seed.slice(),notes:[],phrases:[],currentPhrase:[],queue:[],
    lastNote:seed[seed.length-1],phraseTargetLength:randInt(8,16)
  };
  state.phrases.push({notes:seed.slice(),isSeed:true});
  return state;
}
function pushNote(state,ev){
  if(ev.rest){state.currentPhrase.push({rest:true,duration:ev.duration});}
  else{
    state.notes.push({midi:ev.midi,duration:ev.duration});
    state.currentPhrase.push({midi:ev.midi,duration:ev.duration});
    state.lastNote=ev.midi;
  }
}
function recallIntoQueue(state,g){
  var phrase=pick(state.phrases);
  var notes=phrase.notes.filter(function(n){return n!==null&&n!==undefined;});
  if(notes.length===0)return;
  var seq,t=Math.random();
  if(t<0.5)seq=notes.slice();
  else if(t<0.75)seq=transpose(notes,randInt(-5,5));
  else if(t<0.9)seq=invertSeq(notes);
  else seq=partialSeq(notes);
  if(g>0.3&&Math.random()<0.3)seq=seq.concat(seq);
  for(var i=0;i<seq.length;i++)state.queue.push({midi:seq[i],duration:nextDuration()});
}
function varyIntoQueue(state){
  var motif=[];
  for(var i=0;i<state.currentPhrase.length;i++){
    if(!state.currentPhrase[i].rest)motif.push(state.currentPhrase[i].midi);
  }
  motif=motif.slice(-randInt(3,6));
  if(motif.length<2)return;
  var seq,t=Math.random();
  if(t<0.5)seq=transpose(motif,randInt(-4,4));
  else if(t<0.8)seq=invertSeq(motif);
  else seq=motif.slice();
  for(var i=0;i<seq.length;i++)state.queue.push({midi:seq[i],duration:nextDuration()});
}
function completePhrase(state,g){
  var phraseNotes=[];
  for(var i=0;i<state.currentPhrase.length;i++){
    if(!state.currentPhrase[i].rest)phraseNotes.push(state.currentPhrase[i].midi);
  }
  if(phraseNotes.length>=3)state.phrases.push({notes:phraseNotes,isSeed:false});
  state.currentPhrase=[];
  state.phraseTargetLength=randInt(8,16);
  var recent=state.phrases[state.phrases.length-1];
  if(!recent)return;
  var t=Math.random();
  var repeatBand=0.25+g*0.2,varyBand=0.45+g*0.25;
  if(t<repeatBand){for(var i=0;i<recent.notes.length;i++)state.queue.push({midi:recent.notes[i],duration:nextDuration()});}
  else if(t<varyBand){var s=transpose(recent.notes,randInt(-5,5));for(var i=0;i<s.length;i++)state.queue.push({midi:s[i],duration:nextDuration()});}
  else if(t<0.6){var s=transpose(recent.notes,randInt(2,5));for(var i=0;i<s.length;i++)state.queue.push({midi:s[i],duration:nextDuration()});}
  else if(t<0.75){var s=transpose(recent.notes,randInt(-5,-2));for(var i=0;i<s.length;i++)state.queue.push({midi:s[i],duration:nextDuration()});}
}
function composeNext(state,elapsedMs){
  var g=growth(elapsedMs);
  if(state.queue.length>0){var ev=state.queue.shift();pushNote(state,ev);return ev;}
  if(state.currentPhrase.length>=state.phraseTargetLength){
    completePhrase(state,g);
    if(state.queue.length>0){var ev=state.queue.shift();pushNote(state,ev);return ev;}
  }
  var restProb=0.04+g*0.14;
  if(state.currentPhrase.length===0)restProb+=0.08;
  if(state.currentPhrase.length===state.phraseTargetLength-1)restProb+=0.05;
  if(Math.random()<restProb){var dur=rand(0.2,0.5);state.currentPhrase.push({rest:true,duration:dur});return{rest:true,duration:dur};}
  var r=Math.random();
  var memoryProb=0.08+g*0.5,variationProb=0.08+g*0.18;
  if(r<memoryProb&&state.phrases.length>0)recallIntoQueue(state,g);
  else if(r<memoryProb+variationProb&&state.currentPhrase.length>=3)varyIntoQueue(state);
  if(state.queue.length>0){var ev=state.queue.shift();pushNote(state,ev);return ev;}
  var note=nextByInterval(state.lastNote,g);
  var ev={midi:note,duration:nextDuration()};pushNote(state,ev);return ev;
}

/* ========== KEYBOARD ========== */
var LOW=60,HIGH=84;
var BLACK_SET={1:1,3:1,6:1,8:1,10:1};
function isBlack(midi){return !!BLACK_SET[((midi%12)+12)%12];}
var keys=[],whiteKeys=[],blackKeys=[];
for(var m=LOW;m<=HIGH;m++)keys.push({midi:m,isBlack:isBlack(m)});
for(var i=0;i<keys.length;i++){if(keys[i].isBlack)blackKeys.push(keys[i]);else whiteKeys.push(keys[i]);}
var whitePct=100/whiteKeys.length,blackPct=whitePct*0.62;
var blackPositions={};
for(var i=0;i<blackKeys.length;i++){
  var k=blackKeys[i];var whitesBefore=0;
  for(var j=0;j<whiteKeys.length;j++){if(whiteKeys[j].midi<k.midi)whitesBefore++;}
  blackPositions[k.midi]=whitesBefore*whitePct-blackPct/2;
}

var kbEl=document.getElementById('keyboard');
var bkEl=document.getElementById('black-keys');
var keyEls={};
var keyLightTimers={};
function bindKeyPress(el,midi){
  el.addEventListener('pointerdown',function(e){
    e.preventDefault();
    handleKey(midi);
  });
  /* prevent sticky hover/focus states on touch */
  el.addEventListener('contextmenu',function(e){e.preventDefault();});
}
for(var i=0;i<whiteKeys.length;i++){
  (function(k){
    var el=document.createElement('div');
    el.className='wkey';el.dataset.midi=k.midi;
    bindKeyPress(el,k.midi);
    kbEl.appendChild(el);keyEls[k.midi]=el;
  })(whiteKeys[i]);
}
for(var i=0;i<blackKeys.length;i++){
  (function(k){
    var el=document.createElement('div');
    el.className='bkey';el.dataset.midi=k.midi;
    el.style.left=blackPositions[k.midi]+'%';el.style.width=blackPct+'%';
    bindKeyPress(el,k.midi);
    bkEl.appendChild(el);keyEls[k.midi]=el;
  })(blackKeys[i]);
}

function setKeyActive(midi,active){
  var el=keyEls[midi];if(!el)return;
  if(active)el.classList.add('active');else el.classList.remove('active');
}
function setKeySeed(midi,seed){
  var el=keyEls[midi];if(!el)return;
  if(seed)el.classList.add('seed');else el.classList.remove('seed');
}
function clearAllKeyLights(){
  for(var m in keyLightTimers){clearTimeout(keyLightTimers[m]);}
  keyLightTimers={};
  for(var m in keyEls)setKeyActive(m,false);
}

/* ========== VISUALIZER ========== */
var vizCanvas=document.getElementById('viz');
var vizCtx=vizCanvas.getContext('2d');
var vizBuffer=[];
var vizRAF=null;
function vizResize(){
  var dpr=window.devicePixelRatio||1;
  var w=vizCanvas.clientWidth,h=vizCanvas.clientHeight;
  vizCanvas.width=Math.max(1,w*dpr);vizCanvas.height=Math.max(1,h*dpr);
  vizCtx.setTransform(dpr,0,0,dpr,0,0);
}
function vizAdd(midi){
  vizBuffer.push({midi:midi,t:performance.now()});
  if(vizBuffer.length>500)vizBuffer.shift();
}
function vizClear(){vizBuffer=[];}
function vizDraw(){
  var w=vizCanvas.clientWidth,h=vizCanvas.clientHeight;
  if(w>0&&h>0){
    vizCtx.clearRect(0,0,w,h);
    /* only draw while visible and buffer has notes */
    if(!vizCanvas.classList.contains('hidden')&&vizBuffer.length>0){
      var now=performance.now(),span=20000;
      for(var i=0;i<vizBuffer.length;i++){
        var item=vizBuffer[i],age=now-item.t;
        if(age>span||item.midi==null)continue;
        var x=w-(age/span)*w;
        if(x<-4||x>w+4)continue;
        var norm=(item.midi-48)/(84-48);
        var y=h-(norm*h);
        var alpha=Math.max(0,1-age/span);
        vizCtx.strokeStyle='rgba(0,180,50,'+(alpha*0.85).toFixed(3)+')';
        vizCtx.lineWidth=2;
        vizCtx.beginPath();vizCtx.moveTo(x,Math.max(0,y-12));vizCtx.lineTo(x,Math.min(h,y+4));vizCtx.stroke();
      }
    }
  }
  vizRAF=requestAnimationFrame(vizDraw);
}
function kbScale(){
  var scroll=document.getElementById('kb-scroll');
  var wrap=document.getElementById('kb-wrap');
  if(!scroll||!wrap)return;
  var avail=scroll.clientWidth;
  var base=960;
  var scale=avail>=base?1:avail/base;
  wrap.style.transform='scale('+scale+')';
  /* collapse the layout height to the scaled visual height */
  var baseH=wrap.offsetHeight;
  scroll.style.height=(baseH*scale)+'px';
}
vizResize();kbScale();
window.addEventListener('resize',function(){vizResize();kbScale();});
vizDraw();

/* ========== STATE ========== */
var phase='input';
var inputNotes=[];
var activeTimeouts=[];
var composer=null,timer=null,replayTimer=null,startTime=0,recordedEvents=[];
var sharedEvents=null,shareUrl='',replaying=false;
var seekIndex=0; /* current seek position (event index) */
var replayIndex=0; /* index while playing */

var PHYSICAL_KEYS={
  z:60,s:61,x:62,d:63,c:64,v:65,g:66,b:67,h:68,n:69,j:70,m:71,
  q:72,'2':73,w:74,'3':75,e:76,r:77,'5':78,t:79,'6':80,y:81,'7':82,u:83,i:84
};

var counterEl=document.getElementById('counter');
var controlsEl=document.getElementById('controls');
var cornersEl=document.getElementById('corners');
var resultEl=document.getElementById('result');
var sharedEl=document.getElementById('shared');
var vizEl=document.getElementById('viz');

function fmtTime(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60),sec=s%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');}

function setPhase(p){
  phase=p;
  updateUI();
}

function lightKey(midi,duration){
  setKeyActive(midi,true);
  if(keyLightTimers[midi])clearTimeout(keyLightTimers[midi]);
  var ms=Math.max(160,(duration||0.4)*1000);
  keyLightTimers[midi]=setTimeout(function(){
    setKeyActive(midi,false);
    delete keyLightTimers[midi];
  },ms);
}

function playInputNote(midi){
  resumeAudio();playNote(midi,0.7);lightKey(midi,0.7);
}

function handleKey(midi){
  if(phase!=='input')return;
  if(inputNotes.length>=5)return;
  inputNotes.push(midi);
  playInputNote(midi);
  setKeySeed(midi,true);
  updateUI();
}

function getReplayEvents(){
  if(phase==='result')return recordedEvents;
  if(phase==='shared')return sharedEvents;
  return null;
}

function eventsDuration(events){
  var t=0;
  if(!events)return 0;
  for(var i=0;i<events.length;i++)t+=events[i].duration||0;
  return t;
}

function durationUpTo(events,idx){
  var t=0;
  if(!events)return 0;
  for(var i=0;i<idx&&i<events.length;i++)t+=events[i].duration||0;
  return t;
}

function updateSeekUI(){
  var events=getReplayEvents();
  var total=events?events.length:0;
  var idx=replaying?replayIndex:seekIndex;
  if(idx>total)idx=total;
  var pct=total>0?(idx/total)*100:0;
  var prefix=phase==='shared'?'shared':'result';
  var fill=document.getElementById(prefix+'-fill');
  var handle=document.getElementById(prefix+'-handle');
  var posEl=document.getElementById(prefix+'-pos');
  var timeEl=document.getElementById(prefix+'-time');
  var playBtn=document.getElementById(prefix+'-play');
  if(fill)fill.style.width=pct+'%';
  if(handle)handle.style.left=pct+'%';
  if(posEl)posEl.textContent=idx+' / '+total;
  if(timeEl)timeEl.textContent=fmtTime(durationUpTo(events,idx)*1000)+' / '+fmtTime(eventsDuration(events)*1000);
  if(playBtn){
    if(replaying){
      playBtn.textContent='■ STOP';
      playBtn.classList.add('playing');
    }else{
      playBtn.textContent='▶ PLAY';
      playBtn.classList.remove('playing');
    }
  }
}

function stopReplay(){
  if(replayTimer){clearTimeout(replayTimer);replayTimer=null;}
  activeTimeouts=[];
  clearAllKeyLights();
  if(replaying){
    seekIndex=replayIndex;
  }
  replaying=false;
  updateSeekUI();
  updateUI();
}

function startReplayFrom(startIdx){
  var events=getReplayEvents();
  if(!events||events.length===0)return;
  stopReplay();
  if(startIdx>=events.length)startIdx=0;
  seekIndex=startIdx;
  replayIndex=startIdx;
  replaying=true;
  resumeAudio();
  vizClear();
  updateSeekUI();
  updateUI();
  function playNext(){
    if(!replaying)return;
    if(replayIndex>=events.length){
      seekIndex=events.length;
      stopReplay();
      return;
    }
    var ev=events[replayIndex];
    if(!ev.rest&&ev.midi!=null){
      playNote(ev.midi,ev.duration);
      lightKey(ev.midi,ev.duration);
      vizAdd(ev.midi);
    }
    replayIndex++;
    updateSeekUI();
    replayTimer=setTimeout(playNext,(ev.duration||0.3)*1000);
  }
  playNext();
}

function toggleReplay(){
  if(replaying){
    stopReplay();
  }else{
    startReplayFrom(seekIndex);
  }
}

function seekFromClientX(barEl,clientX){
  var events=getReplayEvents();
  if(!events||events.length===0)return;
  var rect=barEl.getBoundingClientRect();
  var ratio=Math.max(0,Math.min(1,(clientX-rect.left)/rect.width));
  var idx=Math.round(ratio*events.length);
  if(idx>events.length)idx=events.length;
  seekIndex=idx;
  if(replaying){
    startReplayFrom(seekIndex);
  }else{
    updateSeekUI();
  }
}

function tick(){
  if(phase!=='generating')return;
  var elapsedMs=Date.now()-startTime;
  document.getElementById('c-time').textContent=fmtTime(elapsedMs);
  var ev=composeNext(composer,elapsedMs);
  recordedEvents.push(ev);
  if(ev.rest){vizAdd(null);}
  else{playNote(ev.midi,ev.duration);lightKey(ev.midi,ev.duration);vizAdd(ev.midi);
    document.getElementById('c-notes').textContent=(parseInt(document.getElementById('c-notes').textContent,10)+1).toLocaleString();}
  document.getElementById('c-phrases').textContent=composer.phrases.length;
  document.getElementById('c-memory').textContent=composer.phrases.length;
  var delay=ev.duration*1000*(0.92+Math.random()*0.16);
  timer=setTimeout(tick,delay);
}

function startGeneration(){
  if(inputNotes.length!==5)return;
  resumeAudio();
  composer=createComposer(inputNotes.slice());
  recordedEvents=[];
  for(var m in keyEls)setKeySeed(m,false);
  setPhase('thinking');
  setTimeout(function(){
    startTime=Date.now();
    document.getElementById('c-time').textContent='00:00';
    document.getElementById('c-notes').textContent='0';
    document.getElementById('c-phrases').textContent=composer.phrases.length;
    document.getElementById('c-memory').textContent=composer.phrases.length;
    setPhase('generating');tick();
  },1900);
}

function stop(){
  if(timer){clearTimeout(timer);timer=null;}
  var finalTime=Date.now()-startTime;
  var finalNotes=composer?composer.notes.length:0;
  clearAllKeyLights();
  var encoded=encodeEvents(recordedEvents);
  shareUrl=window.location.origin+window.location.pathname+'#data='+encoded;
  document.getElementById('r-computer').textContent=finalNotes.toLocaleString()+' NOTES';
  document.getElementById('r-time').textContent=fmtTime(finalTime);
  seekIndex=0;
  replaying=false;
  setPhase('result');
  updateSeekUI();
}

function reset(){
  if(timer){clearTimeout(timer);timer=null;}
  stopReplay();
  inputNotes=[];
  clearAllKeyLights();
  for(var m in keyEls)setKeySeed(m,false);
  recordedEvents=[];composer=null;sharedEvents=null;shareUrl='';
  seekIndex=0;replayIndex=0;replaying=false;
  if(window.location.hash)history.replaceState(null,'',window.location.pathname+window.location.search);
  document.getElementById('c-time').textContent='00:00';
  document.getElementById('c-notes').textContent='0';
  document.getElementById('c-phrases').textContent='0';
  document.getElementById('c-memory').textContent='0';
  vizClear();
  setPhase('input');
}

function encodeEvents(events){
  var parts=[];
  for(var i=0;i<events.length;i++){
    var e=events[i];
    parts.push(e.rest?'r'+e.duration.toFixed(2):e.midi+'-'+e.duration.toFixed(2));
  }
  return btoa(parts.join(','));
}
function decodeEvents(b64){
  try{
    var str=atob(b64),parts=str.split(','),events=[];
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      if(p[0]==='r')events.push({rest:true,duration:parseFloat(p.slice(1))});
      else{var s=p.split('-');events.push({midi:parseInt(s[0],10),duration:parseFloat(s[1])});}
    }
    return events;
  }catch(e){return null;}
}

function copyShareUrl(){
  if(!shareUrl)return;
  if(navigator.clipboard){
    navigator.clipboard.writeText(shareUrl).then(function(){
      var btn=document.getElementById('share-btn');btn.textContent='[ COPIED ]';
      setTimeout(function(){btn.textContent='[ SHARE ]';},2000);
    }).catch(function(){});
  }
}

function updateUI(){
  /* Counter */
  if(phase==='input'){
    counterEl.innerHTML='';
    var span=document.createElement('span');
    if(inputNotes.length===5){span.className='hint';span.textContent='PRESS ENTER';}
    else{span.textContent=inputNotes.length+' / 5';}
    counterEl.appendChild(span);
  }else if(phase==='thinking'){
    counterEl.innerHTML='<span class="thinking">...</span>';
  }else if(phase==='generating'){
    counterEl.innerHTML='<span class="composing">COMPUTER IS COMPOSING</span>';
  }else{
    counterEl.innerHTML='';
  }

  /* Corners + visualizer */
  if(phase==='generating'){
    cornersEl.classList.remove('hidden');
    vizEl.classList.remove('hidden');
    vizResize();
  }else{
    cornersEl.classList.add('hidden');
    if(phase!=='result'&&phase!=='shared'){
      vizEl.classList.add('hidden');
      vizClear();
    }else{
      vizEl.classList.remove('hidden');
      vizResize();
    }
  }

  /* Controls */
  controlsEl.innerHTML='';
  if(phase==='input'){
    if(inputNotes.length>0){
      var rb=document.createElement('button');rb.className='btn';rb.textContent='RESET';rb.onclick=reset;controlsEl.appendChild(rb);
    }
    if(inputNotes.length===5){
      var gb=document.createElement('button');gb.className='btn go';gb.textContent='BEGIN ▸';gb.onclick=startGeneration;controlsEl.appendChild(gb);
    }
  }else if(phase==='generating'){
    var sb=document.createElement('button');sb.className='btn stop';sb.textContent='■ STOP';sb.onclick=stop;controlsEl.appendChild(sb);
  }

  /* Seed highlights */
  for(var m in keyEls)setKeySeed(m,false);
  if(phase==='input'){for(var i=0;i<inputNotes.length;i++)setKeySeed(inputNotes[i],true);}

  /* Overlays */
  resultEl.classList.toggle('hidden',phase!=='result');
  sharedEl.classList.toggle('hidden',phase!=='shared');

  if(phase==='result'||phase==='shared')updateSeekUI();
}

/* ========== EVENT WIRING ========== */
document.addEventListener('keydown',function(e){
  if(e.repeat)return;
  var key=e.key.toLowerCase();
  if(phase==='input'){
    if(key==='enter'){if(inputNotes.length===5)startGeneration();return;}
    if(key==='backspace'){e.preventDefault();if(inputNotes.length>0){var last=inputNotes.pop();setKeySeed(last,false);updateUI();}return;}
    var midi=PHYSICAL_KEYS[key];
    if(midi!=null){e.preventDefault();handleKey(midi);}
  }
});

/* Seek bar + play controls */
document.querySelectorAll('.seek-bar').forEach(function(bar){
  bar.addEventListener('click',function(e){
    seekFromClientX(bar,e.clientX);
  });
  bar.addEventListener('mousedown',function(e){
    e.preventDefault();
    seekFromClientX(bar,e.clientX);
    function onMove(ev){seekFromClientX(bar,ev.clientX);}
    function onUp(){
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
    }
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });
});

document.getElementById('result-play').addEventListener('click',function(){
  if(phase==='result')toggleReplay();
});
document.getElementById('shared-play').addEventListener('click',function(){
  if(phase==='shared')toggleReplay();
});

document.getElementById('share-btn').addEventListener('click',copyShareUrl);
document.getElementById('reset-btn').addEventListener('click',reset);
document.getElementById('start-own-btn').addEventListener('click',reset);

/* Load shared composition */
(function(){
  var hash=window.location.hash;
  if(hash.indexOf('#data=')===0){
    var events=decodeEvents(hash.slice(6));
    if(events&&events.length>0){
      sharedEvents=events;
      document.getElementById('shared-count').textContent=events.filter(function(e){return !e.rest;}).length+' NOTES';
      seekIndex=0;
      replaying=false;
      setPhase('shared');
      updateSeekUI();
      return;
    }
  }
  setPhase('input');
})();

})();
</script>
</body>
</html>
