<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Can a Computer Become Beethoven?</title>
<meta name="description" content="An experiment: a human plays five notes, then a computer composes on its own. Can structure emerge from memory, repetition and chance?">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#FFFFFF;color:#111;
    font-family:ui-monospace,'SF Mono','Courier New',monospace;
    display:flex;flex-direction:column;min-height:100vh;
    overflow-x:hidden;
  }
  .hidden{display:none!important}

  /* Corners */
  #corners{position:fixed;inset:0;pointer-events:none;z-index:5}
  .corner{position:absolute;font-size:11px;letter-spacing:.15em;color:#999;line-height:1.5}
  .corner .value{color:#333}
  .corner.tl{top:16px;left:16px}
  .corner.tr{top:16px;right:16px;text-align:right}
  .corner.bl{bottom:16px;left:16px}
  .corner.br{bottom:16px;right:16px;text-align:right}

  /* Main */
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
  h1{
    font-family:Georgia,'Times New Roman',serif;
    font-size:clamp(18px,3.4vw,38px);
    color:#000;text-align:center;line-height:1.1;
    margin-bottom:clamp(20px,5vh,48px);font-weight:500;letter-spacing:-.02em;
  }

  /* Keyboard — desktop proportions, scaled to fit (no horizontal scroll) */
  #kb-scroll{
    width:100%;max-width:960px;overflow-x:auto;overflow-y:hidden;
  }
  #kb-wrap{
    width:960px;position:relative;
    height:clamp(180px,32vh,300px);
    transform-origin:top left;
  }
  #keyboard{display:flex;width:100%;height:100%}
  .wkey{
    flex:1;min-width:0;background:#FFF;border:1px solid #000;
    transition:background-color .075s;cursor:pointer;
    touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;
  }
  .wkey.seed{background:#EEE}
  .wkey.lh{background:#F4F4F4}
  .wkey.active{background:#00FF41;box-shadow:0 0 26px 2px rgba(0,255,65,.6)}
  #black-keys{position:absolute;top:0;left:0;right:0;height:62%;pointer-events:none}
  .bkey{
    position:absolute;height:100%;background:#000;border:1px solid #000;
    transition:background-color .075s;cursor:pointer;pointer-events:auto;
    touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;
  }
  .bkey.active{background:#00FF41;box-shadow:0 0 22px 2px rgba(0,255,65,.6)}

  /* Counter */
  #counter{margin-top:16px;height:32px;display:flex;align-items:center;justify-content:center}
  #counter span{font-size:14px;letter-spacing:.3em;color:#999}
  #counter span.hint{color:#00AA22;animation:pulse 1.2s infinite}
  #counter span.thinking{animation:pulse 1.2s infinite;letter-spacing:.4em}
  #counter span.composing{font-size:12px;color:#777}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* Visualizer */
  #viz{width:100%;max-width:960px;margin-top:16px;height:clamp(48px,9vh,90px);display:block}

  /* Controls */
  #controls{margin-top:16px;height:32px;display:flex;align-items:center;gap:24px}
  .btn{
    font-family:inherit;font-size:11px;letter-spacing:.25em;
    color:#777;background:none;border:none;cursor:pointer;transition:color .15s;
  }
  .btn:hover{color:#000}
  .btn.go{color:#00AA22}.btn.go:hover{color:#000}
  .btn.stop{color:#555}.btn.stop:hover{color:#000}

  /* Overlays */
  .overlay{position:fixed;inset:0;z-index:20;background:#FFF;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .stats{font-size:12px;letter-spacing:.2em;color:#999;line-height:1.8;margin-bottom:40px}
  .stats .v{color:#111;font-size:18px;display:block;margin-top:4px}
  .replay-label{font-size:11px;letter-spacing:.25em;color:#999;margin-bottom:16px}
  .seek-wrap{width:100%;max-width:420px;margin-bottom:28px}
  .seek-bar{
    position:relative;width:100%;height:28px;cursor:pointer;
    display:flex;align-items:center;
  }
  .seek-track{
    position:absolute;left:0;right:0;height:3px;background:#DDD;border-radius:2px;
  }
  .seek-fill{
    position:absolute;left:0;height:3px;background:#00AA22;border-radius:2px;width:0%;
    pointer-events:none;
  }
  .seek-handle{
    position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;margin-left:-6px;
    background:#00AA22;border-radius:50%;left:0%;pointer-events:none;
    box-shadow:0 0 0 2px #FFF,0 1px 4px rgba(0,0,0,.15);
  }
  .seek-meta{
    display:flex;justify-content:space-between;margin-top:10px;
    font-size:11px;letter-spacing:.15em;color:#999;
  }
  .seek-meta .pos{color:#333}
  .replay-controls{display:flex;gap:24px;align-items:center;margin-bottom:32px}
  .replay-play{
    font-family:inherit;font-size:13px;letter-spacing:.25em;color:#00AA22;
    background:none;border:none;cursor:pointer;transition:color .15s;
  }
  .replay-play:hover{color:#000}
  .replay-play.playing{color:#555}
  .actions{display:flex;gap:32px;align-items:center}
  .act-btn{
    font-family:inherit;font-size:14px;letter-spacing:.3em;color:#444;
    background:none;border:none;cursor:pointer;transition:color .15s;
  }
  .act-btn:hover{color:#00AA22}
  .act-btn.muted:hover{color:#000}
  .overlay{overflow-y:auto;-webkit-overflow-scrolling:touch;justify-content:flex-start;padding-top:max(28px,env(safe-area-inset-top))}
  .overlay>*{flex-shrink:0}
  .overlay::before,.overlay::after{content:"";margin:auto}
  .stats{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;margin-bottom:28px}
  .stats .v{font-size:16px}
  .player{width:100%;max-width:420px;margin-bottom:26px}
  .player-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .player-label{font-size:11px;letter-spacing:.25em;color:#333}
  .player-sub{font-size:10px;letter-spacing:.15em;color:#aaa}
  .player-row{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
  .player .seek-wrap{margin-bottom:0}
  .player.empty{opacity:.35;pointer-events:none}
  .seek-bar{touch-action:none}
  .mini-btn{font-family:inherit;font-size:11px;letter-spacing:.2em;color:#777;background:none;border:none;cursor:pointer;padding:8px 0}
  .mini-btn:hover{color:#00AA22}
  .mini-btn:disabled{opacity:.5}
  .wkey,.bkey{transition:background-color .06s}
  #kb-wrap{will-change:transform}
</style>
</head>
<body>
<div id="corners" class="hidden">
  <div class="corner tl"><div>TIME</div><div id="c-time" class="value">00:00</div></div>
  <div class="corner tr"><div>NOTES</div><div id="c-notes" class="value">0</div></div>
  <div class="corner bl"><div>MELODY</div><div id="c-phrases" class="value">0 BARS</div></div>
  <div class="corner br"><div>MEMORY</div><div id="c-memory" class="value">0</div></div>
</div>
<main>
  <h1>CAN A COMPUTER BECOME BEETHOVEN?</h1>
  <div id="kb-scroll">
    <div id="kb-wrap">
      <div id="keyboard"></div>
      <div id="black-keys"></div>
    </div>
  </div>
  <div id="counter"><span>0 / 5</span></div>
  <canvas id="viz" class="hidden"></canvas>
  <div id="controls"></div>
</main>

<div id="result" class="overlay hidden">
  <div class="stats">
    <div>HUMAN<span class="v" id="r-human">5 NOTES</span></div>
    <div>COMPUTER<span class="v" id="r-computer">0 NOTES</span></div>
    <div>MELODY<span class="v" id="r-melody">0 BARS</span></div>
    <div>TIME<span class="v" id="r-time">00:00</span></div>
  </div>
  <div id="result-players" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
  <div class="actions">
    <button class="act-btn muted" id="reset-btn">[ RESET ]</button>
  </div>
</div>

<div id="shared" class="overlay hidden">
  <div class="replay-label" style="margin-bottom:8px">SHARED COMPOSITION</div>
  <div style="font-size:14px;color:#444;margin-bottom:24px" id="shared-count">0 NOTES</div>
  <div id="shared-players" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
  <button class="act-btn muted" id="start-own-btn" style="margin-top:8px">[ START YOUR OWN ]</button>
</div>

<script>
(function(){
"use strict";

/* ========== AUDIO ENGINE (Web Audio, look-ahead scheduling) ========== */
/* Every note is scheduled on the audio clock ahead of time, so tap/key lighting,
   timing and legato no longer depend on setTimeout accuracy or per-note Blob decoding. */
var AC=null,master=null,wave=null,keepAudio=null,keepUrl=null;
var DECAY=2.3,ATT=0.006,REL=0.16,bwave=null,pwave=null;
var live=[];                         /* voices that may still be sounding */
var FG_LOOK=1.5,BG_LOOK=15;          /* seconds scheduled ahead (foreground / background) */

function _writeStr(view,offset,str){for(var i=0;i<str.length;i++)view.setUint8(offset+i,str.charCodeAt(i));}
function _encodeWav(samples,sampleRate){
  var n=samples.length,buffer=new ArrayBuffer(44+n*2),view=new DataView(buffer);
  _writeStr(view,0,'RIFF');view.setUint32(4,36+n*2,true);_writeStr(view,8,'WAVE');
  _writeStr(view,12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);
  view.setUint32(24,sampleRate,true);view.setUint32(28,sampleRate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);
  _writeStr(view,36,'data');view.setUint32(40,n*2,true);
  var o=44;
  for(var i=0;i<n;i++){var s=Math.max(-1,Math.min(1,samples[i]));view.setInt16(o,s<0?s*0x8000:s*0x7FFF,true);o+=2;}
  return buffer;
}
function makeWave(ctx){
  /* same timbre as before: fundamental + 2nd/3rd/4th partials, as ONE oscillator */
  return ctx.createPeriodicWave(new Float32Array(9),new Float32Array([0,1,0.5,0.33,0.25,0.18,0.12,0.08,0.05]));
}
function initAudio(){
  if(AC)return AC;
  var C=window.AudioContext||window.webkitAudioContext;
  if(!C)return null;
  try{AC=new C({latencyHint:'interactive'});}catch(e){try{AC=new C();}catch(e2){AC=null;return null;}}
  master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);
  wave=makeWave(AC);bwave=AC.createPeriodicWave(new Float32Array([0,0,0]),new Float32Array([0,1,0.12]));pwave=AC.createPeriodicWave(new Float32Array([0,0,0,0]),new Float32Array([0,0.5,0,0.25]));
  return AC;
}
/* silent looping <audio>: keeps the audio session alive so mobile browsers do not
   suspend the page when it goes to the background / screen locks */
function keepOn(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  if(keepAudio){if(keepAudio.paused)keepAudio.play().catch(function(){});return;}
  var sr=8000,n=sr*2,a=new Float32Array(n);
  for(var i=0;i<n;i++)a[i]=(Math.random()-0.5)*0.00008;      /* ~±1 LSB: not digital silence */
  keepUrl=URL.createObjectURL(new Blob([_encodeWav(a,sr)],{type:'audio/wav'}));
  keepAudio=new Audio(keepUrl);keepAudio.loop=true;keepAudio.setAttribute('playsinline','');
  keepAudio.play().catch(function(){});
}
function keepOff(){if(keepAudio&&!keepAudio.paused)keepAudio.pause();}
function unlockAudio(){
  var ctx=initAudio();if(!ctx)return;
  if(ctx.state!=='running'&&ctx.resume)ctx.resume().catch(function(){});
}
function setMediaSession(on){
  try{
    if(!('mediaSession' in navigator))return;
    if(on){
      navigator.mediaSession.metadata=new MediaMetadata({title:'Can a Computer Become Beethoven?',artist:'Computer composing…'});
      navigator.mediaSession.playbackState='playing';
    }else navigator.mediaSession.playbackState='none';
  }catch(e){}
}
/* time at which the sound scheduled for audio-clock time t is actually heard */
function heardTime(){
  if(!AC)return 0;
  var cur=AC.currentTime,fb=cur-(AC.outputLatency||AC.baseLatency||0);
  try{
    if(AC.getOutputTimestamp){
      var ts=AC.getOutputTimestamp();
      if(ts&&ts.contextTime>0&&ts.performanceTime>0){
        var h=ts.contextTime+(performance.now()-ts.performanceTime)/1000;
        if(h<=cur+0.01&&Math.abs(h-fb)<0.6)return h;
      }
    }
  }catch(e){}
  return fb;
}
/* one note = one oscillator + one gain. Exponential decay matches the old sample synth,
   a short release lets neighbouring notes join smoothly (no clicks, no pile-ups). */
function voice(ctx,dest,w,midi,t,dur,vel,track){
  /* piano-like: quick hammer attack, upper partials fade faster than the fundamental, higher notes
     decay faster, and the tone darkens as the note sounds (a lowpass that closes over time) */
  var osc=ctx.createOscillator(),g=ctx.createGain(),gp=g.gain,lp=ctx.createBiquadFilter();
  osc.setPeriodicWave(w);
  var hz=440*Math.pow(2,(midi-69)/12);
  osc.frequency.value=hz;
  var d=Math.max(0.06,dur),peak=vel*0.36;
  var dk=DECAY*(midi<48?0.8:midi>84?1.5:1+(midi-60)*0.004);
  var vRel=Math.max(0.0003,peak*Math.exp(-dk*(d-ATT)));
  gp.setValueAtTime(0.0001,t);
  gp.linearRampToValueAtTime(peak,t+ATT);
  gp.exponentialRampToValueAtTime(vRel,t+d);
  gp.exponentialRampToValueAtTime(0.0001,t+d+REL);
  var f0=Math.min(9000,Math.max(900,hz*6)),f1=Math.max(450,f0*0.4);
  lp.type='lowpass';lp.Q.value=0.4;
  lp.frequency.setValueAtTime(f0,t);
  lp.frequency.exponentialRampToValueAtTime(f1,t+Math.min(d,1.5));
  osc.connect(lp);lp.connect(g);g.connect(dest);
  osc.start(t);osc.stop(t+d+REL+0.02);
  if(track){
    var vc={osc:osc,g:g,t:t};
    live.push(vc);
    osc.onended=function(){
      try{osc.disconnect();lp.disconnect();g.disconnect();}catch(e){}
      var i=live.indexOf(vc);if(i>=0)live.splice(i,1);
    };
  }
}
function playNote(midi,duration,velocity){
  if(!initAudio())return;
  if(AC.state!=='running')AC.resume().catch(function(){});
  velocity=velocity!=null?velocity:(0.62+Math.random()*0.28);
  voice(AC,master,midi<60?bwave:wave,midi,AC.currentTime+0.004,duration||0.4,velocity,true);
}
/* timbre per voice: 0 = dark (bass / inner), 1 = main, 2 = hollow (pulse) */
function accWave(tn){return tn===2?pwave:tn===1?wave:bwave;}
function schedNote(midi,t,dur,vel,w){voice(AC,master,w||wave,midi,t,dur,vel,true);}
/* fade out everything that is sounding and cancel what has not started yet */
function silenceAll(){
  if(!AC)return;
  var now=AC.currentTime;
  for(var i=0;i<live.length;i++){
    var v=live[i];
    try{
      if(v.t>now+0.005){v.osc.stop(now);}
      else{
        var gp=v.g.gain;
        if(gp.cancelAndHoldAtTime)gp.cancelAndHoldAtTime(now);else gp.cancelScheduledValues(now);
        gp.setTargetAtTime(0,now,0.015);
        v.osc.stop(now+0.12);
      }
    }catch(e){}
  }
}

/* timer that keeps running in background tabs (Worker timers are not throttled like page timers) */
var tickWorker=null,tickUrl=null,tickFallback=null,tickFn=null;
function startTicker(fn){
  tickFn=fn;
  if(tickWorker||tickFallback)return;
  try{
    var src='var id=setInterval(function(){postMessage(0)},25);';
    tickUrl=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
    tickWorker=new Worker(tickUrl);
    tickWorker.onmessage=function(){if(tickFn)tickFn();};
  }catch(e){
    tickWorker=null;
    tickFallback=setInterval(function(){if(tickFn)tickFn();},25);
  }
}
function stopTicker(){
  if(tickWorker){tickWorker.terminate();tickWorker=null;}
  if(tickUrl){URL.revokeObjectURL(tickUrl);tickUrl=null;}
  if(tickFallback){clearInterval(tickFallback);tickFallback=null;}
  tickFn=null;
}

/* ----- offline render + export (fast, native, same voice as live playback) ----- */
function eventsDuration(events){var t=0;if(!events)return 0;for(var i=0;i<events.length;i++)t+=events[i].duration||0;return t;}
function renderOffline(events){
  var sr=44100,total=eventsDuration(events)+0.6;
  var Off=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  if(!Off)return Promise.reject(new Error('no offline audio'));
  var ctx=new Off(1,Math.ceil(total*sr),sr);
  var out=ctx.createGain();out.gain.value=0.9;out.connect(ctx.destination);
  var w=makeWave(ctx),bw=ctx.createPeriodicWave(new Float32Array([0,0,0]),new Float32Array([0,1,0.12])),pwO=ctx.createPeriodicWave(new Float32Array([0,0,0,0]),new Float32Array([0,0.5,0,0.25])),t=0.02;
  for(var i=0;i<events.length;i++){
    var ev=events[i],d=ev.duration||0.3;
    if(!ev.rest&&ev.midi!=null)voice(ctx,out,ev.midi<60?bw:w,ev.midi,t,d,ev.v!=null?ev.v:0.75,false);
    if(ev.acc)for(var ai=0;ai<ev.acc.length;ai++){var a=ev.acc[ai];voice(ctx,out,a.tn===2?pwO:a.tn===1?w:bw,a.midi,t+a.off,a.dur,a.v,false);}
    t+=d;
  }
  return new Promise(function(resolve,reject){
    var p=ctx.startRendering();
    if(p&&p.then)p.then(function(b){resolve(b.getChannelData(0));},reject);
    else ctx.oncomplete=function(e){resolve(e.renderedBuffer.getChannelData(0));};
  });
}
function floatToInt16(samples){
  var out=new Int16Array(samples.length);
  for(var i=0;i<samples.length;i++){var s=Math.max(-1,Math.min(1,samples[i]));out[i]=s<0?s*0x8000:s*0x7FFF;}
  return out;
}
var _lameReady=null;
function loadLamejs(){
  if(window.lamejs)return Promise.resolve(window.lamejs);
  if(_lameReady)return _lameReady;
  _lameReady=new Promise(function(resolve,reject){
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js';
    s.onload=function(){resolve(window.lamejs);};
    s.onerror=function(){_lameReady=null;reject(new Error('lamejs load failed'));};
    document.head.appendChild(s);
  });
  return _lameReady;
}
function encodeMp3(samples,sampleRate,bitrate,onProgress){
  return loadLamejs().then(function(lamejs){
    return new Promise(function(resolve){
      var enc=new lamejs.Mp3Encoder(1,sampleRate,bitrate||128),pcm=floatToInt16(samples),parts=[],i=0,CH=1152*10;
      (function step(){           /* encode in slices so the UI never freezes */
        var t0=performance.now();
        while(i<pcm.length&&performance.now()-t0<14){
          var b=enc.encodeBuffer(pcm.subarray(i,Math.min(i+CH,pcm.length)));
          if(b.length)parts.push(b);
          i+=CH;
        }
        if(onProgress)onProgress(Math.min(1,i/pcm.length));
        if(i<pcm.length)setTimeout(step,0);
        else{var e=enc.flush();if(e.length)parts.push(e);resolve(new Blob(parts,{type:'audio/mpeg'}));}
      })();
    });
  });
}
function downloadBlob(blob,filename){
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;a.style.display='none';
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1500);
}

/* ========== COMPOSER (self-organising tonal engine) ========== */
/* 5 notes -> key + seed motif. The computer then evolves a population of motifs
   (mutation + fitness), settles on a theme, and builds period form
   (antecedent/consequent, contrast, return) out of its own memory. */
var UNIT=0.30;                       /* seconds per eighth note (quarter = 100bpm) */
var NOTE_NAMES=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
var MODES={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10]};
var LOW_MIDI=60,HIGH_MIDI=84;
var THEME_G=0.30;                    /* growth level at which a theme is fixed */
var MAX_POP=16;

function rand(a,b){return a+Math.random()*(b-a);}
function randInt(a,b){return Math.floor(rand(a,b+1));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function weightedPick(items,weights){
  var total=0,i;for(i=0;i<weights.length;i++)total+=Math.max(0,weights[i]);
  if(total<=0)return items[items.length-1];
  var r=Math.random()*total;
  for(i=0;i<items.length;i++){r-=Math.max(0,weights[i]);if(r<=0)return items[i];}
  return items[items.length-1];
}
function mod7(d){return((d%7)+7)%7;}
function sgn(x){return x>0?1:x<0?-1:0;}
function growth(ms){return 1-Math.exp(-ms/130000);}

/* --- key & scale-degree space --- */
function detectKey(seed){
  var best=null;
  for(var t=0;t<12;t++){
    ['major','minor'].forEach(function(mode){
      var sc=MODES[mode],set={},tri={};
      sc.forEach(function(x){set[(t+x)%12]=1;});
      [0,(mode==='major'?4:3),7].forEach(function(x){tri[(t+x)%12]=1;});
      var s=mode==='major'?0.2:0,i;
      for(i=0;i<seed.length;i++){
        var pc=((seed[i]%12)+12)%12;
        s+=set[pc]?2:-2;
        if(tri[pc])s+=0.6;
      }
      var first=((seed[0]%12)+12)%12,last=((seed[seed.length-1]%12)+12)%12;
      if(first===t)s+=1.6;
      if(last===t)s+=1.8;
      else if(last===(t+7)%12)s+=0.6;
      else if(last===(t+(mode==='major'?4:3))%12)s+=0.4;
      if(!best||s>best.score)best={tonic:t,mode:mode,score:s};

    state.thickT=state.thickT>0.5?0.25:1;
    label='TEXTURE \u00b7 '+(state.thickT>0.5?'FULL':'OPEN');

    state.gT=state.gT>0.5?0.1:0.9;

    var best=null,i;
    for(i=0;i<6;i++){var m=mutateMotif(newMotif(state),state);m.fit=motifFit(m,state);if(!best||m.fit>best.fit)best=m;}
    state.pendingTheme={at:state.stage+2,m:best};

  }

}
/* every stage the state moves a fraction of the way toward its targets; a chosen key or theme is taken up two stages later */
function glideStep(state){
  state.thick+=(state.thickT-state.thick)*.35;
  state.g+=(state.gT-state.g)*.35;
  if(state.centerT!=null&&state.center!==state.centerT)state.center+=Math.sign(state.centerT-state.center);
  if(state.pendingTheme&&state.stage>=state.pendingTheme.at){
    var pm=state.pendingTheme.m;state.theme=cloneMotif(pm);state.pop.push(pm);state.pendingTheme=null;
  }
  if(state.pendingKey&&state.stage>=state.pendingKey.at){

function planStage(state){
  var stage=state.stage,stageNo=stage+1,N=segLenFor(stage),i,k;
  syncRange(state);

  if(state.t>=state.changeAt){applyChange(state);state.changeAt+=120+rand(-15,15);}
  if(state.changeFlash){E.flash=state.changeFlash;state.changeFlash=null;}
  evolve(state,14+2*Math.min(stage,8));
  var cands=[],K=stage===0?3:4;
  for(i=0;i<K;i++){var b=buildSegment(state,N);cands.push({bars:b,score:scoreSegment(state,b)+directorFit(state,b)});}
  cands.sort(function(a,b){return b.score-a.score;});
  var best=cands[0],q=state.queue,evs;
  /* 1) drafts: other attempts the computer tries and then discards */
  var nDraft=stage===0?1:Math.min(2,cands.length-1);
  for(k=1;k<=nDraft;k++){
    var db=stage===0?cands[k].bars:cands[k].bars.slice(0,N>=6?2:1);
    evs=barsToEvents(state,db,0.7,'draft');
    evs.push({rest:true,duration:2*UNIT,kind:'draft'});
    if(k===1){
      evs[0].tag='DRAFTING';evs[0].stage=stageNo;evs[0].mem=state.memory.motifs.length;
      if(state.pendingFlash){evs[0].flash=state.pendingFlash;state.pendingFlash=null;}
    }
    for(i=0;i<evs.length;i++)q.push(evs[i]);
  }
  /* 2) re-play the end of the finished melody so the join is audible */
  if(state.tail&&state.tail.length){
    for(i=0;i<state.tail.length;i++){
      var t=state.tail[i],c=t.rest?{rest:true,duration:t.duration,kind:'lead'}:{midi:t.midi,duration:t.duration,v:t.v,kind:'lead'};
      if(i===0)c.tag='CONNECTING';
      q.push(c);
    }
  }
  directorRest(state,q);
  /* 3) the continuation that is adopted into the finished melody */
  state.swell=1+(0.08+0.22*(state.evo?state.evo.cx:0.1))*rand(-1,1);
  var main=barsToEvents(state,best.bars,1,'main');
  addBass(state,best.bars,main);
  addVoices(state,best.bars,main);
  thinTexture(state,main);
  main[0].kb=[state.klo,state.khi];
  if(!(state.tail&&state.tail.length)){main[0].tag='COMPOSING';main[0].stage=stageNo;}
  else main[0].stage=stageNo;
  var total=state.melodyBars+N;
  main[main.length-1].flash='MELODY '+stageNo+' COMPLETE \u00b7 '+total+' BARS';
  main[main.length-1].finBars=total;
  main[main.length-1].segEnd={evs:main.map(plain),bars:N,stage:stageNo,lastAt:0};
  for(i=0;i<main.length;i++)q.push(main[i]);
  if(state.evo&&state.evo.flash)main[0].flash=state.evo.flash;
  directorRecord(state,best.bars);
  state.tail=lastBarOf(main);
  state.lastDeg=lastDegOf(best.bars[N-1]);

function createComposer(seed){

    memory:{motifs:[]},evo:null,dir:null,unit:UNIT,t:0,dynF:1,changeAt:60,changeLast:null,changeFlash:null,thick:1,thickT:1,gT:0,centerT:null,pendingTheme:null,pendingKey:null
  };
  var dmin=-40,dmax=40,found=false;
  for(var d=-21;d<=28;d++){
    var mm=degToMidi(d,key);
    if(mm>=LOW_MIDI&&!found){dmin=d;found=true;}
    if(mm<=HIGH_MIDI)dmax=d;
  }
  state.dmin=dmin;state.dmax=dmax;state.center=midiToDeg(72,key);
  var rel=[0],dirs=[];
  for(i=1;i<seed.length;i++){
    var iv=midiToDeg(seed[i],key)-midiToDeg(seed[i-1],key);
    dirs.push(sgn(iv));
    iv=Math.max(-3,Math.min(3,iv));
    rel.push(rel[i-1]+iv);
  }
  state.seedDirs=dirs;
  state.seedMotif={rh:pickCell(0,seed.length),deg:rel,fit:0,id:state.nextId++};
  state.seedMotif.fit=motifFit(state.seedMotif,state);
  state.theme=cloneMotif(state.seedMotif);
  state.pop=[state.seedMotif];
  state.memory.motifs.push(state.seedMotif);
  for(i=0;i<9;i++){var m=newMotif(state);state.pop.push(m);state.memory.motifs.push(m);}
  state.pop.sort(function(a,b){return b.fit-a.fit;});
  return state;
}


/* ========== E: offline evaluation (no audio) ==========
   Open the console and run beethovenEval(20). Each run composes four stages from
   random 5-note inputs and reports simple statistics of the finished melody. */
window.beethovenEval=function(runs){
  runs=runs||10;
  var rows=[],r,i;
  for(r=0;r<runs;r++){
    var inp=[];
    for(i=0;i<5;i++)inp.push(LOW+Math.floor(Math.random()*(HIGH-LOW+1)));
    var st=createComposer(inp);
    while(st.stage<4)planStage(st);
    var mains=st.queue.filter(function(e){return e.kind==='main'&&!e.rest;});
    var pit=mains.map(function(e){return e.midi;}),steps=0,leaps=0,k;
    for(k=1;k<pit.length;k++){
      var a=Math.abs(pit[k]-pit[k-1]);
      if(a>=1&&a<=2)steps++;else if(a>=5)leaps++;
    }
    var mn=Math.min.apply(null,pit),mx=Math.max.apply(null,pit);
    rows.push({
      key:st.keyName,
      notes:pit.length,
      range:mx-mn,
      stepRatio:+(steps/Math.max(1,pit.length-1)).toFixed(2),
      leaps:leaps,
      endsOnTonic:pit[pit.length-1]%12===st.key.root%12
    });
  }
  console.table(rows);
  return rows;
};

/* the visible part of the 88-key board; keys outside [lo,hi] are hidden and the rest reflow */

function setKeyboardRange(lo,hi){
  var vis=[],i,j;
  for(i=0;i<whiteKeys.length;i++)if(whiteKeys[i].midi>=lo&&whiteKeys[i].midi<=hi)vis.push(whiteKeys[i].midi);

var vizCanvas=document.getElementById('viz');

function vizResize(){
  var dpr=window.devicePixelRatio||1;
  vizW=vizCanvas.clientWidth;vizH=vizCanvas.clientHeight;
  vizCanvas.width=Math.max(1,vizW*dpr);vizCanvas.height=Math.max(1,vizH*dpr);

function drawViz(now){
  if(!vizVisible||vizW<=0||vizH<=0)return;
  var span=20000;
  while(vizBuffer.length&&now-vizBuffer[0].t>span)vizBuffer.shift();
  if(!vizBuffer.length){if(vizDirty){vizCtx.clearRect(0,0,vizW,vizH);vizDirty=false;}return;}
  vizCtx.clearRect(0,0,vizW,vizH);

/* ========== LIVE GENERATION (scheduled on the audio clock) ========== */
function pumpGen(){
  var now=AC.currentTime,look=document.hidden?BG_LOOK:FG_LOOK,guard=0;
  if(gen.t<now-0.15)gen.t=now+0.05;          /* page was frozen: resync, never burst-play */
  while(gen.t<now+look&&guard++<600){
    composer.t=gen.t-gen.startT;
    var ev=composeNext(composer),t=gen.t,d=ev.duration;
    var jit=(0.004+0.012*(composer.evo?composer.evo.cx:0.1))*rand(-1,1);
    var rec={duration:d,at:t};
    if(ev.rest)rec.rest=true;
    else{rec.midi=ev.midi;rec.v=ev.v;schedNote(ev.midi,t+jit,d,ev.v);}
    if(ev.acc){rec.acc=ev.acc;for(var ai=0;ai<ev.acc.length;ai++){var a=ev.acc[ai];schedNote(a.midi,t+a.off+jit,a.dur,a.v,accWave(a.tn));visQ.push({t:t+a.off+jit,dur:a.dur,midi:a.midi,rest:false,gen:false});}visQ.sort(function(x,y){return x.t-y.t;});}
    gen.evs.push(rec);
    visQ.push({t:t,dur:d,rest:ev.rest,midi:ev.midi,gen:true,tag:ev.tag,stage:ev.stage,mem:ev.mem,flash:ev.flash,finBars:ev.finBars,kb:ev.kb});

}

  return lo;

function pumpReplay(){
  var now=AC.currentTime,look=document.hidden?BG_LOOK:FG_LOOK,ev=rp.events,st=rp.starts;
  while(rp.ptr<ev.length){
    var t=rp.t0+(st[rp.ptr]-st[rp.from]);
    if(t>now+look)break;
    var e=ev[rp.ptr++];
    if(t<now-0.08)continue;                  /* missed while frozen: skip instead of piling up */
    if(e.acc)for(var ai=0;ai<e.acc.length;ai++){var a=e.acc[ai];schedNote(a.midi,t+a.off,a.dur,a.v,accWave(a.tn));}
    if(e.rest||e.midi==null)continue;
    schedNote(e.midi,t,e.duration,e.v!=null?e.v:0.75);
  }
  if(rp.ptr>=ev.length&&now>rp.t0+(st[ev.length]-st[rp.from])+REL+0.1)finishReplay();
}
function startReplay(id,idx){
  var ev=tracks[id];if(!ev||!ev.length)return;
  unlockAudio();if(!AC)return;
  stopReplay(true);
  if(idx>=ev.length)idx=0;
  seek[id]=idx;
  keepOn();setMediaSession(true);
  rp={active:true,id:id,events:ev,starts:startsCache[id],from:idx,ptr:idx,t0:AC.currentTime+0.12};
  startTicker(pump);pump();
  renderPlayers();
}
function stopReplay(silent){
  if(!rp.active)return;
  seek[rp.id]=replayIdx();
  rp.active=false;
  silenceAll();
  if(!gen.active){stopTicker();keepOff();setMediaSession(false);}
  if(!silent)renderPlayers();
}
function finishReplay(){
  var id=rp.id;
  rp.active=false;seek[id]=tracks[id].length;
  if(!gen.active){stopTicker();keepOff();setMediaSession(false);}
  renderPlayers();
}

/* ----- player widgets ----- */
var pl={};
function idxFromX(bar,x,n){
  var r=bar.getBoundingClientRect(),ratio=Math.max(0,Math.min(1,(x-r.left)/r.width));
  return Math.round(ratio*n);
}
function mountPlayer(container,id,label,sub,withDl){
  var d=document.createElement('div');d.className='player empty';
  d.innerHTML='<div class="player-head"><span class="player-label">'+label+'</span><span class="player-sub">'+sub+'</span></div>'+
    '<div class="seek-wrap"><div class="seek-bar"><div class="seek-track"></div><div class="seek-fill"></div><div class="seek-handle"></div></div>'+
    '<div class="seek-meta"><span class="pos">0 / 0</span><span class="tm">00:00 / 00:00</span></div></div>'+
    '<div class="player-row"><button class="replay-play">\u25b6 PLAY</button>'+(withDl?'<button class="mini-btn">[ MP3 ]</button>':'<span></span>')+'</div>';
  container.appendChild(d);
  var P={id:id,el:d,bar:d.querySelector('.seek-bar'),fill:d.querySelector('.seek-fill'),handle:d.querySelector('.seek-handle'),
    pos:d.querySelector('.pos'),tm:d.querySelector('.tm'),play:d.querySelector('.replay-play'),dl:d.querySelector('.mini-btn'),
    sub:d.querySelector('.player-sub'),c:{}};
  pl[id]=P;
  P.bar.addEventListener('pointerdown',function(e){
    var n=tracks[id].length;if(!n)return;
    e.preventDefault();
    try{P.bar.setPointerCapture(e.pointerId);}catch(x){}
    var was=rp.active&&rp.id===id;
    if(was)stopReplay(true);
    dragging={id:id,idx:idxFromX(P.bar,e.clientX,n),was:was};
    renderPlayer(id);
  });
  P.bar.addEventListener('pointermove',function(e){
    if(!dragging||dragging.id!==id)return;
    dragging.idx=idxFromX(P.bar,e.clientX,tracks[id].length);
    renderPlayer(id);
  });
  function release(){
    if(!dragging||dragging.id!==id)return;
    var dg=dragging;dragging=null;seek[id]=dg.idx;
    if(dg.was)startReplay(id,dg.idx);else renderPlayer(id);
  }
  P.bar.addEventListener('pointerup',release);
  P.bar.addEventListener('pointercancel',release);
  P.play.addEventListener('click',function(){
    if(rp.active&&rp.id===id)stopReplay();else startReplay(id,seek[id]);
  });
  if(P.dl)P.dl.addEventListener('click',function(){downloadTrack(id,P.dl);});
}
function setC(P,k,v,fn){if(P.c[k]!==v){P.c[k]=v;fn(v);}}
function renderPlayer(id){
  var P=pl[id];if(!P)return;
  var events=tracks[id],total=events.length,st=startsCache[id];
  var playing=rp.active&&rp.id===id;
  var idx=(dragging&&dragging.id===id)?dragging.idx:(playing?replayIdx():seek[id]);
  if(idx>total)idx=total;
  var pct=(total?idx/total*100:0).toFixed(2)+'%';
  setC(P,'fill',pct,function(v){P.fill.style.width=v;P.handle.style.left=v;});
  setC(P,'pos',idx+' / '+total,function(v){P.pos.textContent=v;});
  setC(P,'tm',fmtTime(st[idx]*1000)+' / '+fmtTime(st[total]*1000),function(v){P.tm.textContent=v;});
  setC(P,'play',playing?'\u25a0 STOP':'\u25b6 PLAY',function(v){P.play.textContent=v;P.play.classList.toggle('playing',playing);});
  setC(P,'empty',total===0,function(v){P.el.classList.toggle('empty',v);});
}
function renderPlayers(){for(var id in pl)renderPlayer(id);}
function downloadTrack(id,btn){
  var events=tracks[id];if(!events||!events.length)return;
  btn.disabled=true;btn.textContent='[ RENDERING\u2026 ]';
  var name='beethoven-'+id+'-'+fmtTime(eventsDuration(events)*1000).replace(':','')+'.';
  renderOffline(events).then(function(samples){
    return encodeMp3(samples,44100,128,function(p){btn.textContent='[ ENCODING '+Math.round(p*100)+'% ]';})
      .then(function(blob){downloadBlob(blob,name+'mp3');return 'MP3';},
            function(){downloadBlob(new Blob([_encodeWav(samples,44100)],{type:'audio/wav'}),name+'wav');return 'WAV';});
  }).then(function(kind){btn.textContent='[ SAVED '+kind+' ]';},function(){btn.textContent='[ FAILED ]';})
    .then(function(){setTimeout(function(){btn.textContent='[ MP3 ]';btn.disabled=false;},2200);});
}
mountPlayer(document.getElementById('result-players'),'process','PROCESS','DRAFTS + EVERY STAGE',true);
mountPlayer(document.getElementById('result-players'),'final','FINISHED','COMPLETED MELODIES ONLY',true);
mountPlayer(document.getElementById('shared-players'),'shared','REPLAY','',false);

/* ========== INPUT / RESET / UI ========== */
function handleKey(midi){
  if(phase!=='input'||inputNotes.length>=5)return;
  unlockAudio();
  inputNotes.push(midi);
  playNote(midi,0.7);lightKey(midi,700);
  setKeySeed(midi,true);
  updateUI();
}
function reset(){
  if(thinkTimer){clearTimeout(thinkTimer);thinkTimer=null;}
  gen.active=false;
  stopReplay(true);stopTicker();keepOff();setMediaSession(false);
  silenceAll();visQ=[];dragging=null;
  inputNotes=[];clearAllKeyLights();setKeyboardRange(48,84);
  for(var m in keyEls)setKeySeed(m,false);
  composer=null;
  setTrack('process',[]);setTrack('final',[]);setTrack('shared',[]);
  if(window.location.hash)history.replaceState(null,'',window.location.pathname+window.location.search);
  setText('c-time','00:00');setText('c-notes','0');setText('c-phrases','0 BARS');setText('c-memory','0');
  vizClear();
  setPhase('input');
}
function decodeEvents(b64){
  try{
    var parts=atob(b64).split(','),events=[];
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      if(p[0]==='r')events.push({rest:true,duration:parseFloat(p.slice(1))});
      else{var s=p.split('-'),evn={midi:parseInt(s[0],10),duration:parseFloat(s[1])};if(s[2]!=null&&s[2]!=='')evn.v=parseInt(s[2],10)/100;events.push(evn);}
    }
    return events;
  }catch(e){return null;}
}
function updateUI(){
  if(phase==='input'){
    setCounterHTML(inputNotes.length===5?'<span class="hint">PRESS ENTER</span>':'<span>'+inputNotes.length+' / 5</span>');
  }else if(phase==='thinking')setCounterHTML('<span class="thinking">...</span>');
  else if(phase==='generating')setCounterHTML('<span class="composing">'+composingLabel()+'</span>');
  else setCounterHTML('');

  var gening=phase==='generating';
  cornersEl.classList.toggle('hidden',!gening);
  vizCanvas.classList.toggle('hidden',!gening);
  vizVisible=gening;
  if(gening)vizResize();else vizClear();

  controlsEl.innerHTML='';
  if(phase==='input'){
    if(inputNotes.length>0){var rb=document.createElement('button');rb.className='btn';rb.textContent='RESET';rb.onclick=reset;controlsEl.appendChild(rb);}
    if(inputNotes.length===5){var gb=document.createElement('button');gb.className='btn go';gb.textContent='BEGIN \u25b8';gb.onclick=startGeneration;controlsEl.appendChild(gb);}
  }else if(gening){
    var sb=document.createElement('button');sb.className='btn stop';sb.textContent='\u25a0 STOP';sb.onclick=stop;controlsEl.appendChild(sb);
  }
  for(var m in keyEls)setKeySeed(m,false);
  if(phase==='input')for(var i=0;i<inputNotes.length;i++)setKeySeed(inputNotes[i],true);

  resultEl.classList.toggle('hidden',phase!=='result');
  sharedEl.classList.toggle('hidden',phase!=='shared');
  if(phase==='result'||phase==='shared')renderPlayers();
}

/* ========== FRAME LOOP (single rAF) ========== */
function frame(){
  requestAnimationFrame(frame);
  var now=performance.now();
  expireLights(now);
  if(AC&&visQ.length)drainVis();
  if(phase==='generating')updateGenHud(now);
  else if(rp.active)renderPlayer(rp.id);
  drawViz(now);
}
requestAnimationFrame(frame);

/* ========== EVENT WIRING ========== */
document.addEventListener('keydown',function(e){
  if(e.repeat)return;
  var key=e.key.toLowerCase();
  if(phase==='input'){
    if(key==='enter'){if(inputNotes.length===5){unlockAudio();startGeneration();}return;}
    if(key==='backspace'){e.preventDefault();if(inputNotes.length>0){var last=inputNotes.pop();setKeySeed(last,false);updateUI();}return;}
    var midi=PHYSICAL_KEYS[key];
    if(midi!=null){e.preventDefault();handleKey(midi);}
  }
});
/* unlock audio on the first real gesture (iOS/Android autoplay rules) */
['pointerdown','pointerup','touchend','click'].forEach(function(t){document.addEventListener(t,unlockAudio,{passive:true});});
/* keep going when the page returns from the background; top up the schedule immediately */
document.addEventListener('visibilitychange',function(){
  if(AC&&AC.state!=='running'&&AC.state!=='closed')AC.resume().catch(function(){});
  if(gen.active||rp.active)pump();
});
window.addEventListener('pageshow',function(){if(AC&&AC.state!=='running')AC.resume().catch(function(){});});

document.getElementById('reset-btn').addEventListener('click',reset);
document.getElementById('start-own-btn').addEventListener('click',reset);

/* shared composition via #data= */
(function(){
  var hash=window.location.hash;
  if(hash.indexOf('#data=')===0){
    var events=decodeEvents(hash.slice(6));
    if(events&&events.length>0){
      setTrack('shared',events);
      setText('shared-count',events.filter(function(e){return !e.rest;}).length+' NOTES');
      setPhase('shared');
      return;
    }
  }
  setPhase('input');
})();

})();
</script>
